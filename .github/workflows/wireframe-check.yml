name: MOVA - homologacao do novo wireframe
on:
  push:
    branches: [main]
    paths:
      - wireframe/**
      - .github/workflows/wireframe-check.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mova-wireframe-check
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1440]
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1 axe-core@4.10.3
          npx playwright install --with-deps chromium
      - name: Test wireframe
        env:
          WIDTH: ${{ matrix.width }}
          THEME: ${{ matrix.theme }}
        run: |
          mkdir -p evidence
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mova-http.log 2>&1 &
          cat > smoke.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const width=+process.env.WIDTH,theme=process.env.THEME;
          const rows=[],errors=[];
          let browser;
          (async()=>{
            try{
              browser=await chromium.launch();
              const page=await browser.newPage({viewport:{width,height:width===390?844:900},deviceScaleFactor:1,isMobile:width===390,hasTouch:width===390,locale:'pt-BR'});
              page.on('pageerror',e=>errors.push(e.message));
              const visible=(s)=>page.locator(s).filter({visible:true}).first();
              const click=async(a)=>{
                const selector='button[data-action='+JSON.stringify(a)+']';
                const inside=page.locator('dialog[open] '+selector).filter({visible:true}).last();
                if(await inside.count())return inside.click({timeout:5000});
                return visible(selector).click({timeout:5000});
              };
              const assert=(c,m)=>{if(!c)throw Error(m)};
              async function test(name,fn){
                const row={name,ok:false};
                try{
                  await fn();
                  await page.waitForTimeout(150);
                  row.overflow=await page.evaluate(()=>Math.max(0,document.documentElement.scrollWidth-innerWidth));
                  await page.screenshot({path:'evidence/'+name+'.png',animations:'disabled'});
                  assert(row.overflow<=2,'Estouro da pagina: '+row.overflow);
                  row.clippedValues=await page.evaluate(()=>[...document.querySelectorAll('.metric,.balancevalue,.recordcard .money,td.money')].filter(e=>e.getClientRects().length&&e.scrollWidth>e.clientWidth+2).map(e=>e.textContent.trim()));
                  assert(row.clippedValues.length===0,'Valores cortados: '+row.clippedValues.join(', '));
                  row.ok=true;
                }catch(e){row.error=e.message.slice(0,700);try{await page.screenshot({path:'evidence/'+name+'-failed.png'})}catch{};await page.evaluate(()=>{document.querySelectorAll('dialog[open]').forEach(d=>d.close());if(typeof closeDialog==='function')closeDialog()}).catch(()=>{});}
                rows.push(row);console.log('CHECK '+JSON.stringify(row));
              }
              await page.goto('http://127.0.0.1:8765/wireframe/',{waitUntil:'load'});
              if(theme==='dark')await click('theme');
              await test('01-login',async()=>{assert(await visible('[data-action=login]').isVisible(),'Login ausente')});
              await click('login');
              await test('02-dashboard',async()=>{assert(await page.getByRole('heading',{name:'Visão geral',exact:true}).isVisible(),'Painel ausente')});
              await test('03-payments',async()=>{await click('go:finance-payments');assert(await page.getByRole('heading',{name:'Contas a pagar',exact:true}).isVisible(),'Rota incorreta')});
              await test('04-search',async()=>{await page.locator('#list-search').fill('Horizonte');assert(await visible('#list-results').innerText().then(x=>x.includes('Horizonte')&&!x.includes('Locadora')),'Filtro incorreto');await page.locator('#list-search').fill('')});
              await test('05-summary',async()=>{await click('view:CP-1042');assert(await page.locator('#dialog').isVisible(),'Resumo ausente');assert(await page.locator('#dialog').innerText().then(s=>s.includes('18.750,00')),'Valor ausente')});
              await test('06-editor',async()=>{await click('edit:CP-1042');assert(await page.locator('#f-party').isVisible(),'Editor ausente');await page.locator('#f-description').fill('Material revisado');await click('save');assert(await page.locator('#list-results').innerText().then(s=>s.includes('Material revisado')),'Edicao nao refletida');await click('edit:CP-1042')});
              if(await page.locator('#dialog').isVisible())await click('close');
              await test('07-settlement',async()=>{await click('settle:CP-1042');await click('confirm-settle:CP-1042');assert(await page.locator('#list-results').innerText().then(s=>s.includes('Pago')),'Status ausente')});
              await test('08-receipts',async()=>{await click('go:finance-receipts');assert(await page.getByRole('heading',{name:'Contas a receber',exact:true}).isVisible(),'Rota incorreta')});
              await test('09-cash',async()=>{await click('go:finance-cash');assert(await page.getByRole('heading',{name:'Fluxo de caixa',exact:true}).isVisible(),'Rota incorreta')});
              await test('10-requests',async()=>{await click('go:purchase-requests');assert(await page.getByRole('heading',{name:'Solicitações',exact:true}).isVisible(),'Rota incorreta')});
              await test('11-orders',async()=>{await click('go:purchase-orders');assert(await page.getByRole('heading',{name:'Ordens de compra',exact:true}).isVisible(),'Rota incorreta')});
              async function module(r){if(width===390)await click('more');await click('go:'+r)}
              await test('12-budgets',async()=>{await module('budgets');assert(await page.getByRole('heading',{name:'Orçamentos',exact:true}).isVisible(),'Rota incorreta')});
              await test('13-clients',async()=>{await module('clients');assert(await page.getByRole('heading',{name:'Clientes',exact:true}).isVisible(),'Rota incorreta')});
              await test('14-messages',async()=>{await click('go:messages');await click('thread:0');await page.getByRole('textbox',{name:'Escreva uma mensagem'}).fill('Teste demonstrativo');await page.getByRole('button',{name:'Enviar mensagem'}).click();assert(await page.locator('.threadbody').innerText().then(s=>s.includes('Teste demonstrativo')),'Envio nao refletido')});
              await test('15-theme',async()=>{assert(await page.locator('html').getAttribute('data-theme')===theme,'Tema incorreto')});
              await test('16-selector',async()=>{
                await click('go:finance-payments');
                await click('edit:CP-1042');
                await click('lookup:party');
                await page.locator('#lookup-search').fill('Alfa');
                await page.screenshot({path:'evidence/16-selector-open.png',animations:'disabled'});
                assert(await page.locator('#selector .lookup-choice:visible').count()===1,'Pesquisa do seletor incorreta');
                await page.locator('#selector .lookup-choice:visible').first().click();
                assert(await page.locator('#f-party').inputValue()==='Distribuidora Alfa','Selecao nao refletida');
                await click('close');
              });
              await test('17-item-editor',async()=>{
                await click('go:purchase-requests');await click('edit:SC-032');
                await click('add-item');
                await page.locator('[data-item=description]').fill('Material teste');
                await page.locator('[data-item=qty]').fill('3');
                await page.locator('[data-item=unit]').fill('125');
                assert(await page.locator('#f-amount').inputValue()==='375.00','Total incorreto');
                await page.screenshot({path:'evidence/17-item-editor-open.png',animations:'disabled'});
                await click('save');
                assert(await page.locator('#list-results').innerText().then(x=>x.includes('375,00')),'Total nao refletido');
              });
              await test('18-expressive-layout',async()=>{
                await click('go:dashboard');
                const bounds=await page.evaluate(()=>{
                  const h=document.querySelector('.chartpanel .sectionhead h2').getBoundingClientRect();
                  const c=document.querySelector('#chart-period').getBoundingClientRect();
                  return {overlap:Math.max(h.left,c.left)<Math.min(h.right,c.right)&&Math.max(h.top,c.top)<Math.min(h.bottom,c.bottom),feature:!!document.querySelector('.balancefeature')};
                });
                assert(bounds.feature&&!bounds.overlap,'Composicao ou cabecalho do grafico incorreto');
              });
              await test('19-form-layout',async()=>{
                await click('go:finance-payments');await click('edit:CP-1042');
                const d=await page.locator('#dialog').boundingBox();
                assert(!!d,'Janela ausente');
                if(width===390)assert(Math.abs(d.width-width)<=2&&Math.abs(d.x)<=2,'Janela mobile nao ocupa a largura');
                else assert(Math.abs(d.x-(width-d.width)/2)<=3,'Janela desktop desalinhada');
              });
              await page.evaluate(require('axe-core').source);
              const editorViolations=await page.evaluate(async()=>{
                const a=await axe.run('#dialog',{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}});
                return a.violations.map(v=>({id:v.id,impact:v.impact,count:v.nodes.length,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}));
              });
              rows.push({name:'axe-editor',violations:editorViolations,ok:editorViolations.length===0});
              await click('close');
              await test('20-no-duplicate-primary',async()=>{
                await click('go:dashboard');
                assert(await page.locator('#content button[data-action="new-finance"]:visible').count()===1,'Novo lançamento repetido');
                await click('go:finance-payments');
                assert(await page.locator('button[data-action="new"]:visible').count()===1,'Criação duplicada');
                const repeated=await page.evaluate(()=>[...document.querySelectorAll('.tabbar button')].filter(e=>e.getClientRects().length).map(e=>e.dataset.action));
                assert(new Set(repeated).size===repeated.length,'Abas duplicadas');
                if(width===390){
                  const bounds=await page.evaluate(()=>{const main=document.querySelector('.main').getBoundingClientRect(),dock=document.querySelector('.message-dock').getBoundingClientRect(),create=document.querySelector('.pageactions').getBoundingClientRect();return {main:main.bottom,dock:dock.top,create:create.top}});
                  assert(bounds.main<=Math.min(bounds.dock,bounds.create)+2,'Ações sobrepostas à área de conteúdo');
                }
              });
              await test('21-localized-date-and-status',async()=>{
                await click('edit:CP-1043');
                const date=page.locator('#f-date');
                assert(await date.inputValue()==='28/11/2026','Data fora do formato brasileiro');
                assert(await page.locator('select[name=status]').count()===0,'Status financeiro editável indevidamente');
                await date.fill('31/02/2026');await click('save');
                assert(await page.locator('#dialog').isVisible(),'Data inválida aceita');
                assert(await date.evaluate(el=>!el.validity.valid),'Validação de data ausente');
                await date.fill('28/11/2026');
                await click('close');
              });
              await test('22-discard-protection',async()=>{
                await click('edit:CP-1043');
                await page.locator('#f-description').fill('Rascunho temporário');
                await click('close');
                assert(await page.getByRole('heading',{name:'Descartar alterações?'}).isVisible(),'Descarte sem confirmação');
                await click('continue-edit');
                assert(await page.locator('#f-description').inputValue()==='Rascunho temporário','Rascunho perdido');
                await click('close');await click('discard');
                assert(!await page.locator('#dialog').isVisible(),'Editor não encerrado');
                assert(!await page.locator('#list-results').innerText().then(s=>s.includes('Rascunho temporário')),'Rascunho salvo indevidamente');
              });
              await test('23-menu-no-repetition',async()=>{
                await click('record-more:CP-1042');
                assert(await page.locator('#dialog button[data-action^="view:"]').count()===0,'Ver repetido no menu');
                assert(await page.locator('#dialog button[data-action^="edit:"]').count()===0,'Editar repetido no menu');
                await click('close');
              });
              await test('24-audit-readonly',async()=>{
                await module('settings-home');await click('go:audit');
                assert(await page.locator('#content button[data-action="new"]').count()===0,'Auditoria permite criar');
                assert(await page.locator('#content button[data-action^="edit:"]').count()===0,'Auditoria permite editar');
              });
              await test('25-item-removal',async()=>{
                await click('go:purchase-requests');await click('edit:SC-032');
                await page.locator('#item-lines .itemline button[data-action="remove-item"]').first().click();
                assert(await page.locator('#f-amount').inputValue()==='0.00','Valor residual após remover item');
                await click('close');await click('discard');
              });
              await test('26-domain-approval',async()=>{
                await click('go:purchase-requests');await click('transition:SC-032');
                await page.locator('#f-transitionNote').fill('Conferência demonstrativa');
                await click('transition-confirm:SC-032|Aprovado');
                await click('view:SC-032');
                assert(await page.locator('#dialog').innerText().then(x=>x.includes('Pendente → Aprovado')&&x.includes('Conferência demonstrativa')),'Histórico da aprovação ausente');
                await click('close');
              });
              await test('27-finance-canonical',async()=>{
                await click('go:finance-payments');await click('go:finance-results');await click('go:finance-entries');
                const shared=await page.evaluate(()=>({entries:records['finance-entries'].length,expected:records['finance-payments'].length+records['finance-receipts'].length,paid:records['finance-entries'].find(x=>x.id==='CP-1042')?.status}));
                assert(shared.entries===shared.expected&&shared.paid==='Pago','Projeção financeira dessincronizada');
                await click('edit:CP-1043');
                assert(await page.locator('#f-planAccount').count()===1,'Classificação financeira ausente');
                await click('close');
              });
              await test('28-domain-form-layout',async()=>{
                await click('go:finance-payments');await click('edit:CP-1043');
                assert(await page.locator('#dialog .domain-section:not(.base-section):not(.notes-section)').count()===3,'Seções de lançamento ausentes');
                assert(await page.locator('#f-invoiceFile').count()===1,'Anexo fiscal ausente');
                await click('close');
              });
              await test('29-visual-dashboard',async()=>{
                await click('go:dashboard');
                assert(await page.locator('.overview-grid .sparkline').count()===3,'Indicadores visuais incompletos');
                assert(await page.locator('.donut-legend>div').count()===3,'Distribuição financeira ausente');
                assert(await page.locator('.recent-list .recent-item').count()>0,'Movimentos recentes ausentes');
                if(width===390){
                  const b=await page.evaluate(()=>({main:document.querySelector('.main').getBoundingClientRect().bottom,dock:document.querySelector('.pageactions').getBoundingClientRect().top}));
                  assert(b.main<=b.dock+2,'Animação deslocou a faixa de ações');
                }
              });
              await test('30-task-board',async()=>{
                await module('task-center');
                assert(await page.locator('.task-board .board-column').count()===3,'Quadro de tarefas incompleto');
                await click('view-mode:list');assert(await page.locator('.tablewrap').count()===1,'Lista ausente');
                await click('view-mode:board');assert(await page.locator('.task-board').count()===1,'Quadro ausente');
              });
              await test('31-contact-grid',async()=>{
                await module('clients');
                assert(await page.locator('.contact-card').count()>0,'Cards de clientes ausentes');
                await click('view-mode:list');assert(await page.locator('.tablewrap').count()===1,'Lista de clientes ausente');
                await click('view-mode:grid');assert(await page.locator('.contacts-grid').count()===1,'Grade ausente');
              });
              await test('32-reduced-motion',async()=>{
                await page.emulateMedia({reducedMotion:'reduce'});
                await click('go:dashboard');
                const durations=await page.evaluate(()=>[...document.querySelectorAll('.page-enter,.sparkpath,.bar')].map(el=>getComputedStyle(el).animationDuration));
                assert(durations.every(v=>v==='0s'),'Movimento reduzido não respeitado');
                await page.emulateMedia({reducedMotion:'no-preference'});
              });
              await test('33-editor-section-navigation',async()=>{
                await click('go:finance-payments');await click('edit:CP-1043');
                assert(await page.locator('#dialog .editor-nav button').count()===5,'Índice de seções incompleto');
                await click('form-section:3');
                await page.waitForTimeout(550);
                const pos=await page.evaluate(()=>{const e=document.querySelector('#editor-section-3').getBoundingClientRect(),n=document.querySelector('.editor-nav').getBoundingClientRect();return {top:e.top,nav:n.bottom,bottom:e.bottom}});
                await click('close');
                assert(pos.bottom>pos.nav&&pos.top<pos.nav+150,'Seção não foi localizada');
              });
              await test('34-record-identity-layout',async()=>{
                await click('go:finance-payments');
                const identity=width===390?page.locator('.record-identity').first():page.locator('.table-identity').first();
                assert(await identity.isVisible(),'Identidade visual do registro ausente');
                if(width===1440){
                  const bounds=await page.evaluate(()=>({main:document.querySelector('.main').getBoundingClientRect().right,dock:document.querySelector('.message-dock').getBoundingClientRect().left}));
                  assert(bounds.main<=bounds.dock+2,'Dock sobreposto ao conteúdo desktop');
                }
              });
              await test('35-segmented-control',async()=>{
                await module('clients');
                const bounds=await page.evaluate(()=>[...document.querySelectorAll('.view-switch button')].map(e=>e.getBoundingClientRect().top));
                assert(bounds.length===2&&Math.abs(bounds[0]-bounds[1])<=2,'Controle de visualização quebrou linha');
              });
              await test('36-purchase-flow-layout',async()=>{
                await click('go:purchase-requests');
                assert(await page.locator('.purchase-flow .purchase-step').count()===4,'Etapas de compras ausentes');
                assert(await page.locator('.tabbar').count()===0,'Navegação de compras duplicada');
                await click('view:SC-032');
                assert(await page.locator('.summary-flow .current').count()===1,'Etapa do registro não indicada');
                await click('close');
              });
              await test('37-budget-tree-layout',async()=>{
                await module('budgets');
                assert(await page.locator('.budget-card').count()===2,'Cards de orçamentos ausentes');
                const card=page.locator('.budget-card').filter({hasText:'OR-012'});
                await card.locator('.budget-details>summary').click();
                await card.locator('.budget-stage>summary').first().click();
                assert(await card.locator('.budget-leaf:visible').count()>0,'Hierarquia não expansível');
                await click('edit:OR-012');
                assert(await page.locator('[data-item=stage]').count()===3,'Etapas ausentes no formulário');
                assert(await page.locator('#f-amount').inputValue()==='425000','Valor do orçamento inconsistente');
                await click('close');
              });
              await test('38-stock-layout',async()=>{
                await module('warehouse-overview');
                assert(await page.locator('.stock-track').count()===1,'Indicador visual de disponibilidade ausente');
                assert(await page.locator('.location-card').count()>0,'Locais ausentes');
                await click('go:warehouse-stock');
                assert(await page.locator('.material-card').count()===3,'Cards de materiais ausentes');
                await click('view-mode:list');assert(await page.locator('.tablewrap').count()===1,'Lista de estoque ausente');
                await click('view-mode:stock');
              });
              async function flatSurface(selector){
                const failures=await page.evaluate(sel=>[...document.querySelectorAll(sel)].filter(e=>e.getClientRects().length).filter(e=>{const c=getComputedStyle(e);return c.backgroundColor!=='rgba(0, 0, 0, 0)'||c.boxShadow!=='none'||c.borderTopWidth!=='0px'}).map(e=>e.className),selector);
                assert(failures.length===0,'Superfícies aninhadas: '+failures.join(', '));
              }
              await test('39-flat-dashboard',async()=>{
                await click('go:dashboard');
                assert(await page.locator('.panel .workitem').count()>0,'Agrupamento ausente');
                await flatSurface('.panel .workitem,.panel .recent-item');
              });
              await test('40-flat-editor',async()=>{
                await click('go:finance-payments');await click('edit:CP-1043');
                await flatSurface('#dialog .domain-section');
                assert(await page.locator('#dialog .editor-nav').count()===1,'Índice ausente');
                assert(await page.locator('#dialog .dialogbody .editor-nav').count()===0,'Índice dentro da rolagem');
                await click('close');
              });
              await test('41-flat-summary',async()=>{
                await click('go:finance-payments');await click('view:CP-1043');
                await flatSurface('.summary-content .summary,.summary-content .historyline');
                assert(await page.locator('.summary-identity').count()===1,'Identidade do resumo ausente');
                await click('close');
              });
              await test('42-flat-budget-and-stock',async()=>{
                await module('budgets');
                await flatSurface('.budget-card .budget-total');
                const card=page.locator('.budget-card').filter({hasText:'OR-012'});
                await card.locator('.budget-details>summary').click();
                await card.locator('.budget-stage>summary').first().click();
                await flatSurface('.budget-card .budget-stage,.budget-card .budget-leaf');
                await module('warehouse-overview');await flatSurface('.panel .location-card,.panel .linktile');
                await click('go:warehouse-stock');await flatSurface('.material-card .material-quantity');
              });
              await test('43-flat-board-and-settings',async()=>{
                await module('task-center');await flatSurface('.board-column');
                await module('settings-home');await flatSurface('.panel .linktile');
              });
              const inventory=await page.evaluate(()=>Object.entries(routes).map(([id,r])=>({id,title:r.title,group:r.group,entry:groups.find(g=>g[0]===r.group)?.[2],hidden:hiddenRoutes.has(id)})));
              for(const r of inventory){
                await test('route-'+r.id,async()=>{
                  if(width===390){await click('more');await click('go:'+r.entry)}
                  else await click('go:'+r.entry);
                  if(r.hidden&&r.group==='Financeiro')await click('go:finance-results');
                  if(r.id!==r.entry)await click('go:'+r.id);
                  const expected=r.id==='dashboard'?'Visão geral':r.id==='warehouse-overview'?'Estoque':r.title;
                  assert(await page.locator('.pagehead h1').innerText()===expected,'Pagina diferente: '+expected);
                  assert(!await page.getByText('Reconstrução ainda não implantada',{exact:true}).count(),'Rota sem implementacao');
                });
              }
              await click('go:messages');
              await click('thread:0');
              await page.waitForTimeout(550);
              await page.evaluate(require('axe-core').source);
              const violations=await page.evaluate(async()=>{const a=await axe.run({runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa']}});return a.violations.map(v=>({id:v.id,impact:v.impact,count:v.nodes.length,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))}))});
              rows.push({name:'axe-messages',violations,ok:violations.length===0});
            }catch(e){rows.push({name:'startup',ok:false,error:e.message})}
            finally{
              if(browser)await browser.close();
              const summary={width,theme,attempted:rows.length,passed:rows.filter(r=>r.ok).length,errors};
              fs.writeFileSync('evidence/report.json',JSON.stringify({summary,rows},null,2));console.log('WIREFRAME '+JSON.stringify(summary));if(errors.length||rows.some(x=>!x.ok))process.exitCode=1;
            }
          })();
          JS
          node smoke.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mova-wireframe-${{ matrix.width }}-${{ matrix.theme }}
          path: evidence/
          retention-days: 7
