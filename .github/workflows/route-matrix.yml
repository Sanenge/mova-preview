name: MOVA - matriz completa de rotas
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/route-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        width: [390, 1440]
        theme: [light, dark]
    steps:
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture registered demo routes
        env:
          WIDTH: ${{ matrix.width }}
          THEME: ${{ matrix.theme }}
          MOVA_URL: https://sanenge.github.io/mova-preview/
        run: |
          mkdir -p audit
          cat > routes.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          const width=Number(process.env.WIDTH),theme=process.env.THEME;
          const rows=[],errors=[];
          let startupError=null,browser;
          const safe=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');
          (async()=>{
            try{
              browser=await chromium.launch({headless:true});
              const page=await browser.newPage({viewport:{width,height:width===390?844:900},deviceScaleFactor:1,locale:'pt-BR',colorScheme:theme,hasTouch:width===390,isMobile:width===390});
              page.on('pageerror',e=>errors.push(String(e.message).slice(0,300)));
              const response=await page.goto(process.env.MOVA_URL,{waitUntil:'load',timeout:60000});
              if(!response?.ok())throw Error('HTTP '+response?.status());
              await page.waitForFunction(()=>typeof Registry!=='undefined'&&typeof Store!=='undefined'&&typeof App!=='undefined',{},{timeout:45000});
              const demo=page.getByRole('button',{name:'Explorar o Mova de demonstração',exact:true});
              // Each worker starts with a fresh browser context. Wait for the
              // asynchronous auth portal, not just the underlying app shell.
              await demo.waitFor({state:'visible',timeout:45000});
              await page.screenshot({path:'audit/00-login.png',animations:'disabled'});
              await demo.click({timeout:15000});
              await demo.waitFor({state:'hidden',timeout:20000});
              await page.waitForFunction(()=>document.querySelector('#authPortalHost')?.getAttribute('aria-hidden')==='true',{},{timeout:20000});
              await page.getByRole('button',{name:'Painel',exact:true}).filter({visible:true}).first().waitFor({timeout:15000});
              if(await page.evaluate(()=>document.documentElement.dataset.theme)!==theme){
                const controls=page.locator('[data-theme-toggle]');
                const visible=controls.filter({visible:true});
                if(await visible.count()){
                  try{await visible.first().click({timeout:2500})}catch{}
                }
                if(await page.evaluate(()=>document.documentElement.dataset.theme)!==theme){
                  // Use the installed theme action event for render coverage.
                  // This does not assert physical tap accessibility.
                  if(!await controls.count())throw Error('Controle de tema ausente');
                  await controls.first().dispatchEvent('click');
                }
                await page.waitForFunction(t=>document.documentElement.dataset.theme===t,theme,{timeout:10000});
              }
              const routes=await page.evaluate(()=>Object.entries(Registry.routes).map(([id,r])=>({id,title:r.title,module:r.module,hidden:!!(r.hidden||r.menuHidden)})));
              console.log('REGISTERED '+routes.length);
              fs.writeFileSync('audit/registry.json',JSON.stringify(routes,null,2));
              for(const route of routes){
                const item={...route,ok:false};
                const before=errors.length;
                try{
                  if(await page.evaluate(()=>document.body.dataset.route)!==route.id){
                    const control=page.locator('[data-route='+JSON.stringify(route.id)+']');
                    if(await control.count()===0){item.blocker=route.hidden?'hidden-route-unmapped':'route-control-missing';throw Error('Sem controle de rota no DOM atual');}
                    // Dispatch through the installed application event bridge; this is
                    // route-render coverage, not a physical click usability test.
                    await control.first().dispatchEvent('click');
                    await page.waitForFunction(id=>document.body.dataset.route===id,route.id,{timeout:2500});
                  }
                  await page.waitForTimeout(200);
                  Object.assign(item,await page.evaluate(()=>{
                    const root=document.querySelector('.app-content');
                    const vis=e=>!!e.getClientRects().length&&getComputedStyle(e).visibility!=='hidden';
                    return {actualRoute:document.body.dataset.route,rendered:!!root&&root.textContent.trim().length>10,heading:root?.querySelector('h1,h2')?.textContent?.trim()||'',overflow:Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth),actualTheme:document.documentElement.dataset.theme,inputs:root?[...root.querySelectorAll('input,select,textarea')].filter(vis).length:0,actions:root?[...root.querySelectorAll('button:not([disabled])')].filter(vis).length:0};
                  }));
                  if(await page.locator('#authPortalHost[aria-hidden="false"]').count())throw Error('Login visivel');
                  if(!item.rendered)throw Error('Conteudo nao renderizado');
                  await page.screenshot({path:'audit/'+safe(route.id)+'.png',animations:'disabled',timeout:10000});
                  item.captured=true;
                  item.ok=item.actualRoute===route.id&&item.actualTheme===theme&&item.overflow<=2&&errors.length===before;
                }catch(e){item.error=String(e.message).slice(0,600)}
                item.errors=errors.slice(before);
                rows.push(item);
                console.log('ROUTE '+JSON.stringify(item));
              }
            }catch(e){startupError=String(e.message).slice(0,1000);console.error(startupError)}
            finally{
              if(browser)await browser.close();
              const summary={width,theme,registered:rows.length,passed:rows.filter(r=>r.ok).length,captured:rows.filter(r=>r.captured).length,missingControl:rows.filter(r=>r.blocker==='route-control-missing').length,hiddenUnmapped:rows.filter(r=>r.blocker==='hidden-route-unmapped').length,rendered:rows.filter(r=>r.rendered).length,overflow:rows.filter(r=>r.overflow>2).length,startupError,errors};
              fs.writeFileSync('audit/report.json',JSON.stringify({summary,rows},null,2));
              console.log('MATRIX '+JSON.stringify(summary));
              if(startupError||!rows.length||summary.passed+summary.hiddenUnmapped!==rows.length)process.exitCode=1;
            }
          })();
          JS
          node routes.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mova-routes-${{ matrix.width }}-${{ matrix.theme }}
          path: audit/
          retention-days: 7
          if-no-files-found: error
