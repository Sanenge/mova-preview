name: MOVA - auditoria visual responsiva R18
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [360, 768, 1024, 1440]
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-audit --no-fund --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture visual matrix
        env:
          WIDTH: ${{ matrix.width }}
          THEME: ${{ matrix.theme }}
        run: |
          mkdir -p evidence
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mova-http.log 2>&1 &
          cat > visual.cjs <<'JS'
          const {chromium}=require('playwright');const fs=require('fs');
          (async()=>{const width=Number(process.env.WIDTH),theme=process.env.THEME,rows=[],errors=[];const browser=await chromium.launch();
          try{const page=await browser.newPage({viewport:{width,height:width<=800?844:900},deviceScaleFactor:1,locale:'pt-BR',reducedMotion:'reduce'});
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:8765/wireframe/');if(theme==='dark')await page.locator('[data-action=theme]:visible').first().click();await page.locator('[data-action=login]').click();
          const ids=await page.evaluate(()=>Object.keys(routes));
          for(const id of ids){await page.evaluate(id=>go(id),id);await page.waitForTimeout(80);const row=await page.evaluate(id=>({id,title:document.querySelector('h1')?.textContent,overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),badTable:[...document.querySelectorAll('.table-identity strong')].filter(e=>e.getClientRects().length&&(e.scrollWidth>e.clientWidth+2||e.parentElement.clientWidth<110)).map(e=>e.textContent),clipped:[...document.querySelectorAll('.metric,.balancevalue,.recordcard .money,td.money')].filter(e=>e.getClientRects().length&&e.scrollWidth>e.clientWidth+2).map(e=>e.textContent.trim())}),id);rows.push(row);await page.screenshot({path:'evidence/'+id+'.png',animations:'disabled'});}
          }finally{await browser.close();fs.writeFileSync('evidence/report.json',JSON.stringify({width,theme,rows,errors},null,2));console.log('VISUAL '+JSON.stringify({width,theme,captured:rows.length,overflow:rows.filter(r=>r.overflow>2).length,clipped:rows.filter(r=>r.clipped.length).length,badTable:rows.filter(r=>r.badTable.length).length,errors}));if(rows.length!==66||errors.length||rows.some(r=>r.overflow>2||r.clipped.length||r.badTable.length))process.exitCode=1}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-r18-${{ matrix.width }}-${{ matrix.theme }}
          path: evidence/
          retention-days: 7
